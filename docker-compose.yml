# ─────────────────────────────────────────────
# e-Registro Brasil — docker-compose.yml
# ─────────────────────────────────────────────

services:

  # ── Banco de Dados ──────────────────────────
  db:
    image: postgres:16-alpine
    container_name: eregistro_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - eregistro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eregistro_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - eregistro_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicação Django ────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eregistro_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eregistro_net
    expose:
      - "8000"

  # ── Nginx (proxy reverso) ───────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: eregistro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/mediafiles:ro
    depends_on:
      - web
    networks:
      - eregistro_net

# ── Volumes ─────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:

# ── Redes ───────────────────────────────────
networks:
  eregistro_net:
    driver: bridge
