# e-Registro Brasil — Nginx (produção): eregistrobrasil.com.br

upstream django {
    server web:8000;
}

# ── HTTP: redireciona para HTTPS + challenge Let's Encrypt ───────────────────
server {
    listen 80;
    server_name eregistrobrasil.com.br www.eregistrobrasil.com.br;

    # Desafio ACME (Let's Encrypt / Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name eregistrobrasil.com.br www.eregistrobrasil.com.br;

    ssl_certificate     /etc/letsencrypt/live/eregistrobrasil.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eregistrobrasil.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Cabeçalhos de segurança
    add_header X-Frame-Options           "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-XSS-Protection          "1; mode=block"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Arquivos estáticos
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Arquivos de mídia
    location /media/ {
        alias /app/mediafiles/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy para o Django
    location / {
        proxy_pass            http://django;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_redirect        off;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }
}
