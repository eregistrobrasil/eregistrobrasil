# e-Registro Brasil — vhost para o nginx do SISTEMA (não Docker)
# Instale em: /etc/nginx/sites-available/eregistrobrasil.com.br
# Ative com:  ln -s /etc/nginx/sites-available/eregistrobrasil.com.br /etc/nginx/sites-enabled/
# SSL via:    certbot --nginx -d eregistrobrasil.com.br -d www.eregistrobrasil.com.br

upstream eregistro_django {
    server 127.0.0.1:8001;
}

# ── HTTP: redireciona para HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    server_name eregistrobrasil.com.br www.eregistrobrasil.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name eregistrobrasil.com.br www.eregistrobrasil.com.br;

    # Certificados gerenciados pelo certbot do sistema
    ssl_certificate     /etc/letsencrypt/live/eregistrobrasil.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eregistrobrasil.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Cabeçalhos de segurança
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Proxy para o Gunicorn (container Docker na porta 8001)
    location / {
        proxy_pass            http://eregistro_django;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_redirect        off;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }
}
