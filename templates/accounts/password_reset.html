{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Recuperar senha</h1>
      <p class="text-gray-500 text-sm mb-8">Informe seu e-mail e enviaremos as instruções.</p>

      <form method="POST" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">{{ field.label }}</label>
          <input type="email" name="{{ field.html_name }}"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                 placeholder="seu@email.com" required>
        </div>
        {% endfor %}
        <button type="submit"
                class="w-full bg-primary text-white font-bold py-3 rounded-xl hover:bg-primary-dark transition-colors">
          Enviar instruções
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        <a href="{% url 'accounts:login' %}" class="text-primary hover:underline">Voltar para o login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
