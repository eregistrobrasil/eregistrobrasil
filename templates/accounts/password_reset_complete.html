{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 p-8 text-center">
    <svg class="w-16 h-16 text-accent mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <h1 class="text-xl font-bold text-gray-900 mb-3">Senha redefinida!</h1>
    <p class="text-gray-500 text-sm">Sua senha foi alterada com sucesso.</p>
    <a href="{% url 'accounts:login' %}" class="inline-block mt-6 bg-primary text-white font-bold px-6 py-2.5 rounded-xl hover:bg-primary-dark transition-colors text-sm">
      Fazer login
    </a>
  </div>
</div>
{% endblock %}
