{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Redefinir senha</h1>
    <form method="POST" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">{{ field.label }}</label>
        <input type="password" name="{{ field.html_name }}"
               class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" required>
        {% for error in field.errors %}<p class="text-red-500 text-xs mt-1">{{ error }}</p>{% endfor %}
      </div>
      {% endfor %}
      <button type="submit" class="w-full bg-primary text-white font-bold py-3 rounded-xl hover:bg-primary-dark transition-colors">
        Salvar nova senha
      </button>
    </form>
  </div>
</div>
{% endblock %}
