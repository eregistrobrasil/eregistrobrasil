{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 p-8 text-center">
    <svg class="w-16 h-16 text-primary mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    </svg>
    <h1 class="text-xl font-bold text-gray-900 mb-3">E-mail enviado!</h1>
    <p class="text-gray-500 text-sm">Verifique sua caixa de entrada e siga as instruções para redefinir sua senha.</p>
    <a href="{% url 'accounts:login' %}" class="inline-block mt-6 text-primary hover:underline text-sm">Voltar para o login</a>
  </div>
</div>
{% endblock %}
