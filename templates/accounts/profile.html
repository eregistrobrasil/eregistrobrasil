{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-gray-900 mb-8">Meu Perfil</h1>

  <div class="bg-white rounded-2xl border border-gray-200 p-8">
    <form method="POST" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">{{ field.label }}</label>
        <input type="{{ field.field.widget.input_type }}"
               name="{{ field.html_name }}"
               value="{{ field.value|default:'' }}"
               placeholder="{{ field.field.widget.attrs.placeholder|default:'' }}"
               class="w-full border {% if field.errors %}border-red-400{% else %}border-gray-300{% endif %} rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
               {% if field.field.required %}required{% endif %}>
        {% for error in field.errors %}<p class="text-red-500 text-xs mt-1">{{ error }}</p>{% endfor %}
      </div>
      {% endfor %}

      <div class="flex gap-3 mt-6">
        <button type="submit" class="bg-primary text-white font-bold px-6 py-2.5 rounded-xl hover:bg-primary-dark transition-colors text-sm">
          Salvar Alterações
        </button>
        <a href="{% url 'accounts:dashboard' %}" class="text-sm text-gray-500 hover:text-gray-700 self-center">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
