<div class="card flex items-center gap-4 p-5 {% if alert and value > 0 %}!border-red-200{% endif %}">
  <div class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg
    {% if color == 'blue' %}bg-blue-50 text-blue-600
    {% elif color == 'green' %}bg-green-50 text-green-600
    {% elif color == 'red' %}bg-red-50 text-red-600
    {% elif color == 'indigo' %}bg-indigo-50 text-indigo-600
    {% else %}bg-gray-100 text-gray-500{% endif %}">
    <i class="bi text-base
      {% if icon == 'plus-circle' %}bi-plus-circle
      {% elif icon == 'clock' %}bi-clock
      {% elif icon == 'exclamation' %}bi-exclamation-triangle
      {% elif icon == 'check-circle' %}bi-check-circle
      {% else %}bi-graph-up{% endif %}"></i>
  </div>
  <div class="min-w-0">
    <p class="text-2xl font-bold leading-tight tracking-tight {% if alert and value > 0 %}text-red-600{% else %}text-gray-900{% endif %}">{{ value }}</p>
    <p class="truncate text-xs font-medium text-gray-500">{{ label }}</p>
  </div>
</div>
