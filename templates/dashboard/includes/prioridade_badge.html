<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold
  {% if prioridade == 'baixa' %}bg-gray-100 text-gray-600
  {% elif prioridade == 'media' %}bg-blue-100 text-blue-700
  {% elif prioridade == 'alta' %}bg-orange-100 text-orange-700
  {% elif prioridade == 'urgente' %}bg-red-100 text-red-700 animate-pulse{% endif %}">
  {% if prioridade == 'urgente' %}⚡ {% endif %}{{ label }}
</span>
