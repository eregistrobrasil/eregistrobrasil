{# Badge de prioridade. Parâmetros: prioridade, label #}
<span class="badge
  {% if prioridade == 'baixa' %}bg-gray-50 text-gray-600 ring-gray-500/20
  {% elif prioridade == 'media' %}bg-blue-50 text-blue-700 ring-blue-600/20
  {% elif prioridade == 'alta' %}bg-orange-50 text-orange-700 ring-orange-600/20
  {% elif prioridade == 'urgente' %}bg-red-50 text-red-700 ring-red-600/20
  {% else %}bg-gray-50 text-gray-600 ring-gray-500/20{% endif %}">
  {% if prioridade == 'urgente' %}<i class="bi bi-lightning-charge-fill text-[10px]"></i>
  {% else %}<span class="badge-dot
    {% if prioridade == 'baixa' %}bg-gray-400
    {% elif prioridade == 'media' %}bg-blue-500
    {% elif prioridade == 'alta' %}bg-orange-500
    {% else %}bg-gray-400{% endif %}"></span>{% endif %}
  {{ label }}
</span>
