{# Badge de status do pedido — estilo discreto com ponto colorido. Parâmetros: status, label #}
<span class="badge
  {% if status == 'pending' %}bg-yellow-50 text-yellow-800 ring-yellow-600/20
  {% elif status == 'paid' %}bg-blue-50 text-blue-700 ring-blue-600/20
  {% elif status == 'novo' %}bg-indigo-50 text-indigo-700 ring-indigo-600/20
  {% elif status == 'em_analise' %}bg-purple-50 text-purple-700 ring-purple-600/20
  {% elif status == 'aguardando_documentos' %}bg-orange-50 text-orange-700 ring-orange-600/20
  {% elif status == 'em_processamento' %}bg-blue-50 text-blue-700 ring-blue-600/20
  {% elif status == 'em_cartorio' %}bg-cyan-50 text-cyan-700 ring-cyan-600/20
  {% elif status == 'pronto_envio' %}bg-teal-50 text-teal-700 ring-teal-600/20
  {% elif status == 'enviado' %}bg-lime-50 text-lime-700 ring-lime-600/20
  {% elif status == 'concluido' or status == 'completed' %}bg-green-50 text-green-700 ring-green-600/20
  {% elif status == 'cancelado' %}bg-red-50 text-red-700 ring-red-600/20
  {% else %}bg-gray-50 text-gray-600 ring-gray-500/20{% endif %}">
  <span class="badge-dot
    {% if status == 'pending' %}bg-yellow-500
    {% elif status == 'paid' %}bg-blue-500
    {% elif status == 'novo' %}bg-indigo-500
    {% elif status == 'em_analise' %}bg-purple-500
    {% elif status == 'aguardando_documentos' %}bg-orange-500
    {% elif status == 'em_processamento' %}bg-blue-500
    {% elif status == 'em_cartorio' %}bg-cyan-500
    {% elif status == 'pronto_envio' %}bg-teal-500
    {% elif status == 'enviado' %}bg-lime-500
    {% elif status == 'concluido' or status == 'completed' %}bg-green-500
    {% elif status == 'cancelado' %}bg-red-500
    {% else %}bg-gray-400{% endif %}"></span>
  {{ label }}
</span>
