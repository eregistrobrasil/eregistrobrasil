{% load static %}
<header class="bg-primary shadow-md sticky top-0 z-50">

  <!-- Header principal -->
  <div class="max-w-7xl mx-auto px-3 sm:px-4 py-2 header-inner flex flex-col justify-center">
    <div class="flex items-center gap-2 sm:gap-4">

      <!-- Logo -->
      <a href="{% url 'products:home' %}" class="flex-shrink-0">
        <img src="{% static 'img/logo.png' %}"
             alt="E-Registro Brasil"
             class="site-logo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <span style="display:none" class="font-bold text-xl sm:text-2xl text-white">
          E-Registro<span class="text-accent-light">Brasil</span>
        </span>
      </a>

      <!-- Busca desktop -->
      <div class="flex-1 max-w-2xl hidden sm:block">
        <form action="{% url 'products:search' %}" method="GET" class="flex">
          <input type="text" name="q" value="{{ request.GET.q }}"
                 placeholder="Buscar certidão, documento..."
                 class="flex-1 border border-white/30 rounded-l-lg px-4 py-2.5 text-sm focus:outline-none focus:border-white focus:ring-1 focus:ring-white bg-white/20 text-white placeholder-white/70">
          <button type="submit"
                  class="bg-white text-primary px-4 py-2.5 rounded-r-lg hover:bg-gray-100 transition-colors font-semibold text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </button>
        </form>
      </div>

      <!-- Ações -->
      <div class="flex items-center gap-1 flex-shrink-0 ml-auto sm:ml-0">
        {% if user.is_authenticated %}
          <a href="{% url 'accounts:dashboard' %}"
             class="flex items-center gap-1.5 text-xs font-medium text-white hover:text-white/80 transition-colors px-2 py-2 rounded-lg hover:bg-white/10">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="hidden md:block">Minha Conta</span>
          </a>
        {% else %}
          <a href="{% url 'accounts:login' %}"
             class="flex items-center gap-1.5 bg-white text-primary text-xs font-semibold px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors whitespace-nowrap">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span>Sou Cliente</span>
          </a>
        {% endif %}

        <!-- Carrinho -->
        <a href="{% url 'orders:cart' %}" class="relative flex items-center text-white hover:text-white/80 transition-colors p-2 rounded-lg hover:bg-white/10">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 3h2l.4 2M7 13h10l4-4H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          {% if cart_count > 0 %}
            <span id="cart-badge" class="absolute -top-0.5 -right-0.5 bg-accent text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">
              {{ cart_count }}
            </span>
          {% endif %}
        </a>
      </div>
    </div>

    <!-- Busca mobile — logo abaixo da linha do logo/ações -->
    <div class="mt-2 sm:hidden">
      <form action="{% url 'products:search' %}" method="GET" class="flex">
        <input type="text" name="q" value="{{ request.GET.q }}"
               placeholder="Buscar certidão ou documento..."
               class="flex-1 border border-white/30 rounded-l-lg px-3 py-2.5 text-sm focus:outline-none focus:border-white bg-white/20 text-white placeholder-white/70">
        <button type="submit"
                class="bg-white text-primary px-4 py-2.5 rounded-r-lg hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Navegação de categorias -->
  <nav class="bg-primary-dark overflow-x-auto" style="-webkit-overflow-scrolling:touch; scrollbar-width:none; -webkit-scrollbar:none;">
    <style>.header-nav::-webkit-scrollbar{display:none}</style>
    <div class="max-w-7xl mx-auto px-2 header-nav overflow-x-auto">
      <ul class="flex items-center whitespace-nowrap min-w-max mx-auto sm:justify-center">
        <li>
          <a href="{% url 'products:home' %}"
             class="block px-4 py-3 text-xs font-semibold text-white hover:bg-white/10 transition-colors {% if request.resolver_match.url_name == 'home' %}bg-white/20{% endif %}">
            Todos
          </a>
        </li>
        {% for cat in all_categories %}
        <li>
          <a href="{{ cat.get_absolute_url }}"
             class="block px-4 py-3 text-xs font-medium text-white/90 hover:text-white hover:bg-white/10 transition-colors {% if request.resolver_match.kwargs.slug == cat.slug %}bg-white/20 text-white{% endif %}">
            {{ cat.name }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </nav>

</header>
