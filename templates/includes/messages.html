{% if messages %}
<div class="max-w-7xl mx-auto px-4 pt-4 space-y-2" id="messages-container">
  {% for message in messages %}
  <div class="flex items-start gap-3 p-4 rounded-lg border
    {% if message.tags == 'success' %}bg-green-50 border-green-200 text-green-800
    {% elif message.tags == 'error' %}bg-red-50 border-red-200 text-red-800
    {% elif message.tags == 'warning' %}bg-yellow-50 border-yellow-200 text-yellow-800
    {% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %}"
       role="alert">
    <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
      {% if message.tags == 'success' %}
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
      {% elif message.tags == 'error' %}
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
      {% else %}
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
      {% endif %}
    </svg>
    <p class="text-sm">{{ message }}</p>
    <button onclick="this.parentElement.remove()" class="ml-auto flex-shrink-0 opacity-70 hover:opacity-100">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
