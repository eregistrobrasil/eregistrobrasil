{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 p-10 text-center">
    <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-3">Pagamento Recusado</h1>
    <p class="text-gray-500 text-sm mb-6">Não foi possível processar seu pagamento.<br>Verifique os dados do cartão e tente novamente.</p>
    <div class="space-y-3">
      <a href="{% url 'payments:create' order.pk %}"
         class="block w-full bg-accent text-white font-bold py-3 rounded-xl hover:bg-accent-light transition-colors text-sm">
        Tentar novamente
      </a>
      <a href="{% url 'orders:order_detail' order.pk %}" class="block text-sm text-gray-500 hover:text-primary transition-colors">Ver pedido</a>
    </div>
  </div>
</div>
{% endblock %}
