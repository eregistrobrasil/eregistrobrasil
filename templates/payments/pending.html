{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 p-10 text-center">
    <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-3">Pagamento em Análise</h1>
    <p class="text-gray-500 text-sm mb-2">Seu pagamento está sendo processado.</p>
    <p class="text-gray-500 text-sm mb-6">Você receberá uma confirmação assim que for aprovado.</p>
    <a href="{% url 'orders:order_detail' order.pk %}"
       class="inline-block bg-primary text-white font-bold px-8 py-3 rounded-xl hover:bg-primary-dark transition-colors text-sm">
      Acompanhar pedido
    </a>
  </div>
</div>
{% endblock %}
