<!-- _campo_cartorio.html -->
<div class="animate-fade-in animate-delay-3" id="cartorio-field-wrapper">
  <label for="select-cartorio" class="block text-sm font-medium text-gray-700 mb-1">
    Cartório <span class="text-red-500">*</span>
  </label>

  <!-- Select dinâmico de cartórios -->
  <div id="cartorio-select-wrapper">
    <select id="select-cartorio" disabled
            class="field-input w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm text-gray-500
                   focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all duration-200 bg-gray-50">
      <option value="">— Selecione primeiro a cidade —</option>
    </select>
  </div>

  <!-- Loading -->
  <div id="cartorio-loading" class="hidden mt-1">
    <div class="flex items-center gap-2 text-gray-400 text-xs">
      <svg class="animate-spin w-3.5 h-3.5" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      Buscando cartórios...
    </div>
  </div>

  <!-- Mensagem sem cartórios -->
  <p id="cartorio-empty" class="hidden text-xs text-amber-600 mt-1">
    Nenhum cartório cadastrado para esta cidade. Nossa equipe irá localizá-lo.
  </p>

  <!-- Erro de validação -->
  <p id="cartorio-error" class="hidden text-xs text-red-500 mt-1">Selecione um cartório.</p>

  <!-- Hidden inputs (submetidos ao servidor) -->
  <input type="hidden" id="cartorio-id-input" name="cartorio_id" value="">
  <input type="hidden" id="cartorio-nome-input" name="cartorio" value="">
</div>
