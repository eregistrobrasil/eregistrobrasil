<!-- _campo_cartorio.html -->
<div class="animate-fade-in animate-delay-3">
  <label for="nome-cartorio" class="block text-sm font-medium text-gray-700 mb-1">
    Nome do Cartório <span class="text-red-500">*</span>
  </label>
  <input
    type="text"
    id="nome-cartorio"
    name="cartorio"
    class="field-input w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm placeholder-gray-400 transition-all duration-200"
    placeholder="Ex: 1º Cartório de Registro Civil"
    value="{{ form.cartorio.value|default:'' }}"
    autocomplete="off"
  />
  <div class="flex items-start justify-between mt-1.5 gap-2">
    <div>
      {% if form.cartorio.errors %}
        <p class="text-xs text-red-500">{{ form.cartorio.errors.0 }}</p>
      {% else %}
        <p id="cartorio-error" class="hidden text-xs text-red-500">Informe o nome do cartório.</p>
      {% endif %}
    </div>
    <button
      type="button"
      id="btn-nao-sei-cartorio"
      class="flex-shrink-0 text-xs text-primary hover:text-primary-dark underline underline-offset-2 transition-colors"
      aria-label="Preencher com Cartório não informado"
    >Não sei o cartório</button>
  </div>
</div>
