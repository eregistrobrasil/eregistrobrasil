<!-- _campo_cidade.html -->
<div class="animate-fade-in animate-delay-2">
  <label for="select-cidade" class="block text-sm font-medium text-gray-700 mb-1">
    Cidade <span class="text-red-500">*</span>
  </label>
  <div id="cidade-wrapper">
    <select id="select-cidade" name="cidade" class="select2-cidade w-full" required {% if not form.cidade.value %}disabled{% endif %}>
      {% if form.cidade.value %}
        <option value="{{ form.cidade.value }}" selected>{{ form.cidade.value }}</option>
      {% else %}
        <option value="">Selecione primeiro o estado</option>
      {% endif %}
    </select>
  </div>
  <div id="cidade-skeleton" class="skeleton hidden"></div>
  {% if form.cidade.errors %}
    <p class="text-xs text-red-500 mt-1">{{ form.cidade.errors.0 }}</p>
  {% else %}
    <p id="cidade-error" class="hidden text-xs text-red-500 mt-1">Selecione uma cidade.</p>
  {% endif %}
</div>
