<!-- _campo_estado.html -->
<div class="animate-fade-in animate-delay-1">
  <label for="select-estado" class="block text-sm font-medium text-gray-700 mb-1">
    Estado <span class="text-red-500">*</span>
  </label>
  <select id="select-estado" name="estado" class="select2-estado w-full" required>
    <option value="">Selecione um estado</option>
    {% for estado in estados %}
      <option value="{{ estado.uf }}" {% if form.estado.value == estado.uf %}selected{% endif %}>{{ estado.uf }} — {{ estado.nome }}</option>
    {% endfor %}
  </select>
  {% if form.estado.errors %}
    <p class="text-xs text-red-500 mt-1">{{ form.estado.errors.0 }}</p>
  {% else %}
    <p id="estado-error" class="hidden text-xs text-red-500 mt-1">Selecione um estado.</p>
  {% endif %}
</div>
