<!-- _resumo_lateral.html -->
<aside class="lg:col-span-1 animate-fade-in animate-delay-2" aria-label="Resumo do pedido">
  <div class="bg-white rounded-2xl shadow-md border border-gray-200 p-6 lg:sticky lg:top-6 space-y-4">

    <div class="flex items-center gap-3 border-b border-gray-100 pb-4">
      <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <div>
        <h3 class="text-sm font-semibold text-gray-800">Resumo do Pedido</h3>
        <p class="text-xs text-gray-400">{{ title }}</p>
      </div>
    </div>

    <div class="space-y-3 text-sm">
      <p class="text-xs text-gray-400 uppercase tracking-wide font-medium">Cartório</p>
      <div class="space-y-1.5">
        <div class="flex items-start gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 mt-0.5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
          </svg>
          <span class="text-gray-700">
            {{ cartorio_data.cidade }}{% if cartorio_data.estado_uf %} — {{ cartorio_data.estado_uf }}{% endif %}
          </span>
        </div>
        <div class="flex items-start gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 mt-0.5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
          </svg>
          <span class="text-gray-700">{{ cartorio_data.cartorio }}</span>
        </div>
      </div>
    </div>

    <a href="{% url step1_url %}"
      class="block text-xs text-center text-primary hover:text-primary-dark underline underline-offset-2 transition-colors pt-1"
      aria-label="Voltar e alterar dados do cartório">← Alterar dados do cartório</a>
  </div>
</aside>
